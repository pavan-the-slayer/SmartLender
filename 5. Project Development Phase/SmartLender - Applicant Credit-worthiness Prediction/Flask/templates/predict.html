<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Lender - Predict</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Loan Approval Prediction</h1>
    <form action="{{ url_for('pred') }}" method="POST">

      <label>Gender</label>
      <select name="Gender" required>
        <option value="1">Male</option>
        <option value="0">Female</option>
      </select>

      <label>Married</label>
      <select name="Married" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>Dependents</label>
      <select name="Dependents" required>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3+</option>
      </select>

      <label>Education</label>
      <select name="Education" required>
        <option value="1">Graduate</option>
        <option value="0">Not Graduate</option>
      </select>

      <label>Self Employed</label>
      <select name="Self_Employed" required>
        <option value="0">No</option>
        <option value="1">Yes</option>
      </select>

      <label>Applicant Income</label>
      <input type="number" step="any" name="ApplicantIncome" required>

      <label>Coapplicant Income</label>
      <input type="number" step="any" name="CoapplicantIncome" required>

      <label>Loan Amount (in thousands)</label>
      <input type="number" step="any" name="LoanAmount" required>

      <label>Loan Amount Term (in days)</label>
      <input type="number" step="any" name="Loan_Amount_Term" required>

      <label>Credit History</label>
      <select name="Credit_History" required>
        <option value="1">Has all debts paid (1)</option>
        <option value="0">Has unpaid debts (0)</option>
      </select>

      <label>Property Area</label>
      <select name="Property_Area" required>
        <option value="2">Urban</option>
        <option value="1">Semiurban</option>
        <option value="0">Rural</option>
      </select>

      <button class="btn" type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
