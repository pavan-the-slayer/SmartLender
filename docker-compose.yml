version: "3.9"

services:
  predict-api:
    build:
      context: .
      dockerfile: predict_api/Dockerfile
    image: smartlender-predict-api:local
    ports:
      - "5000:5000"
    environment:
      - PREDICT_API_KEY=${PREDICT_API_KEY:-dev-local-key-123}
      # Uncomment to use real AWS Secrets Manager instead of the env var above:
      # - AWS_SECRET_NAME=smartlender/predict-api-key
      # - AWS_REGION=us-east-1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    image: smartlender-webapp:local
    ports:
      - "5001:5001"
    environment:
      - PREDICT_API_KEY=${PREDICT_API_KEY:-dev-local-key-123}
      - PREDICT_URL=http://predict-api:5000/predict
    depends_on:
      predict-api:
        condition: service_healthy
